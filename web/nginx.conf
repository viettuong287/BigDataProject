server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /nginx.conf { return 404; }

    # kpi.json sinh lại sau mỗi lần nạp; trình duyệt luôn hỏi lại (ETag) để không hiển thị số/giao diện cũ.
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
